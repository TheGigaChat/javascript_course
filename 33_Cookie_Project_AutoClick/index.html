<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <p id="count">Count: 0</p>
    <img id="cookie" draggable="false" src="image/cookie.png" alt="Cookie Image">
    <section class="shop">

        <section class="shop-button">
            <p id="clickPower">Current click power: 1</p>
            <button id="clickButton">
                <p>+1 per click</p>
                <p id="clickCost" class="cost">Cost: 10</p>
                <p class="description">Increase click power</p>
            </button>
        </section>

        <section class="shop-button">
            <p id="autoClickPower">Current auto-click power: 0</p>
            <button id="autoClickButton">
                <p>+1 auto-click</p>
                <p id="autoClickCost" class="cost">Cost: 50</p>
                <p class="description">Increase auto-click power</p>
            </button>
        </section>

    </section>
</body>
</html>
